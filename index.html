<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR WARS QUESTIONS</title>
<style>
  :root{
    /* palette */
    --gold:#f5d142;
    --gold-hi:#fff3b8;
    --gold-dim:#a9860b;
    --blue:#3fa9f5;
    --cyan:#7dd8ff;
    --red:#ff5f5f;
    --green:#4ce09a;
    /* lightsaber blades: a white-hot core wrapped in a saturated bloom */
    --saber-blue:#5cc8ff;
    --saber-blue-core:#eaf8ff;
    --saber-blue-glow:rgba(92,200,255,.55);
    --saber-red:#ff4d4d;
    --saber-red-core:#ffe8e8;
    --saber-red-glow:rgba(255,77,77,.55);
    --bg:#000004;
    --ink:#e9edf8;
    --ink-mid:#9fabc7;
    --ink-dim:#69748f;
    /* structure */
    --line:rgba(125,216,255,.14);
    --line-mid:rgba(125,216,255,.26);
    --line-hi:rgba(125,216,255,.42);
    --glass:rgba(10,24,38,.34);
    --glass-soft:rgba(125,216,255,.045);
    --scan:repeating-linear-gradient(180deg,rgba(125,216,255,.04) 0,rgba(125,216,255,.04) 1px,transparent 1px,transparent 3px);
    --blur:blur(24px) saturate(170%);
    --ease:cubic-bezier(.22,.61,.36,1);
    --bar:clamp(46px,6vh,58px);
    --gutter:clamp(20px,4vw,64px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;padding:0;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- ambient background ---------- */
  #stars,#stars2,#stars3{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .twinkle{position:absolute;background:#fff;border-radius:50%;animation:tw linear infinite;}
  @keyframes tw{0%,100%{opacity:.12;}50%{opacity:1;}}

  .glow{position:fixed;z-index:1;pointer-events:none;border-radius:50%;filter:blur(100px);}
  .glow-gold{width:44vw;height:44vw;background:var(--gold);top:-18vw;left:50%;transform:translateX(-50%);opacity:.14;}
  .glow-blue{width:48vw;height:48vw;background:var(--blue);bottom:-20vw;right:-10vw;opacity:.26;}
  .glow-cyan{width:42vw;height:42vw;background:var(--cyan);top:32%;left:-14vw;opacity:.18;}

  /* ---------- app shell: topbar / main / bottombar, edge to edge ---------- */
  .app{
    position:relative;z-index:2;
    height:100vh;height:100dvh;
    display:grid;
    /* the column must not size to max-content, or nowrap bar text widens the whole page */
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr) auto;
  }
  /* pin each region to its own row: hiding a bar must not let .main slide up into the auto track */
  /* the toggle floats above every screen, so the topbar keeps its corner clear */
  .sound-toggle{
    position:fixed;z-index:20;
    top:calc((var(--bar) - 32px) / 2);right:var(--gutter);
    width:32px;height:32px;padding:0;border:none;background:none;
    display:grid;place-items:center;color:var(--ink-dim);cursor:pointer;
    transition:color .25s var(--ease),opacity .25s var(--ease);
  }
  .sound-toggle:hover{color:var(--cyan);}
  .sound-toggle .slash{display:none;}
  .sound-toggle.muted{opacity:.55;}
  .sound-toggle.muted .wave{display:none;}
  .sound-toggle.muted .slash{display:block;}

  .topbar{grid-row:1;}
  .main{grid-row:2;}
  .bottombar{grid-row:3;}

  .bar{
    position:relative;
    min-height:var(--bar);
    display:flex;align-items:center;gap:clamp(10px,2vw,22px);
    padding:0 var(--gutter);
    background:linear-gradient(180deg,rgba(5,12,22,.66),rgba(5,12,22,.14));
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  }
  /* declared after .bar so it wins the padding shorthand; keeps the sound toggle's corner clear */
  .topbar{border-bottom:1px solid var(--line);z-index:5;padding-right:calc(var(--gutter) + 42px);}
  .bottombar{border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(5,12,22,.66),rgba(5,12,22,.14));}

  /* hairline progress pinned to the very top edge of the viewport */
  .progress{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(125,216,255,.09);overflow:hidden;}
  .progress-fill{
    height:100%;width:0;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold) 60%,var(--gold-hi));
    box-shadow:0 0 12px rgba(245,209,66,.65);
    transition:width .45s var(--ease);
  }

  /* doubles as the way out of a quiz: clicking the wordmark returns to the episode list */
  .mark{
    position:relative;border:none;padding:0;font:inherit;cursor:pointer;
    font-size:clamp(11px,1.05vw,13px);font-weight:900;
    letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;
    background:linear-gradient(180deg,#fff6c9,var(--gold) 55%,var(--gold-dim));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    transition:filter .3s var(--ease);
  }
  .mark::after{
    content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;
    background:var(--gold-dim);
    transform:scaleX(0);transform-origin:100% 50%;
    transition:transform .35s var(--ease);
  }
  .mark:hover{filter:brightness(1.3);}
  .mark:hover::after,.mark:focus-visible::after{transform:scaleX(1);transform-origin:0 50%;}
  .mark:focus-visible{outline:none;}
  /* the wordmark is clipped to a gradient, so the icon needs its own explicit stroke */
  .mark-icon{display:none;width:17px;height:17px;stroke:var(--gold-dim);}
  .meta{
    margin-left:auto;display:flex;align-items:center;gap:clamp(8px,1.4vw,16px);
    font-size:clamp(10px,.95vw,11.5px);letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-dim);white-space:nowrap;
  }
  .meta .sep{width:1px;height:11px;background:var(--line-mid);}
  .meta .em{color:var(--cyan);}
  .meta .lv{color:var(--ink);font-weight:700;}
  .meta .pos{color:var(--gold);font-weight:800;letter-spacing:.1em;}

  /* ---------- screens fill the main row exactly ---------- */
  .main{position:relative;min-height:0;}
  .screen{position:absolute;inset:0;animation:rise .45s var(--ease);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .hidden{display:none !important;}

  /* state-driven chrome: crawl and select screens are full-bleed, no bars */
  body[data-state="crawl"] .topbar,
  body[data-state="crawl"] .bottombar,
  body[data-state="intro"] .topbar,
  body[data-state="intro"] .bottombar,
  body[data-state="level"] .topbar,
  body[data-state="level"] .bottombar{display:none;}
  body[data-state="quiz"] .bar-result,
  body[data-state="result"] .bar-quiz{display:none;}
  /* the opening crawl stays pure starfield, as in the films */
  .glow{transition:opacity .8s var(--ease);}
  body[data-state="crawl"] .glow{opacity:0;}

  /* ---------- 1. crawl (root) : starfield + text only ---------- */
  #screen-crawl{overflow:hidden;perspective:520px;perspective-origin:50% 100%;animation:none;}
  .crawl-fade{position:absolute;top:0;left:0;right:0;height:36%;background:linear-gradient(#000 14%,transparent);z-index:3;pointer-events:none;}
  .crawl{
    position:absolute;left:50%;bottom:0;width:84%;max-width:1060px;
    transform:translateX(-50%) rotateX(34deg);transform-origin:50% 100%;text-align:center;
  }
  .crawl-inner{
    color:var(--gold);font-weight:700;
    font-size:clamp(21px,3.5vw,38px);line-height:1.62;
    text-shadow:0 0 26px rgba(245,209,66,.18);
    animation:crawlmove 22s linear forwards;
  }
  .crawl-inner h3{font-size:1.18em;margin:0 0 1em;letter-spacing:.06em;}
  .crawl-inner p{margin:0 0 1.1em;}
  @keyframes crawlmove{from{transform:translateY(85%);}to{transform:translateY(-172%);}}

  /* ---------- 2. select screen : full-width hero + episode grid ---------- */
  /* hero band on top, episode columns filling every remaining pixel below */
  #screen-intro,#screen-level{display:grid;grid-template-rows:auto minmax(0,1fr);}
  .level-ep{
    font-size:clamp(10px,1.1vw,13px);font-weight:800;letter-spacing:.32em;
    text-transform:uppercase;color:var(--cyan);
  }
  .level-title{
    margin:clamp(8px,1.4vh,14px) 0 0;font-weight:900;
    font-size:clamp(24px,4.2vw,48px);letter-spacing:.02em;line-height:1.1;
    background:linear-gradient(180deg,#fff7cf 0%,var(--gold) 48%,var(--gold-dim) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(245,209,66,.2));
  }
  .hero{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:clamp(22px,5vh,58px) var(--gutter);
  }
  .hero-title{margin:0;}
  .hero-logo{
    display:block;width:min(560px,80vw);height:auto;margin:0 auto;
    /* the same backward tilt as the opening crawl */
    transform:perspective(620px) rotateX(11deg);
    filter:drop-shadow(0 6px 26px rgba(245,209,66,.26));
  }
  /* Arial Black / Impact give the heavy condensed caps the mark relies on */
  .logo-line,.logo-sub{
    font-family:"Arial Black","Helvetica Neue",Impact,sans-serif;
    font-weight:900;text-anchor:middle;
    paint-order:stroke fill;
    stroke:#120d00;stroke-linejoin:round;
  }
  .logo-line{font-size:96px;fill:url(#logoGold);stroke-width:7px;}
  .logo-sub{font-size:34px;fill:url(#logoGoldSub);stroke-width:4px;}
  .hero-sub{
    margin:clamp(10px,1.6vh,16px) 0 0;
    font-size:clamp(9.5px,1vw,11.5px);letter-spacing:.34em;text-transform:uppercase;
    color:var(--cyan);opacity:.82;
  }
  .hero-rule{
    width:min(420px,60vw);height:1px;margin:clamp(14px,2vh,20px) auto;
    background:linear-gradient(90deg,transparent,var(--line-hi),transparent);
  }
  /* fixed 3 columns keeps 6 episodes as a balanced 3x2 block instead of an orphaned 5+1 */
  .quiz-grid{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    grid-auto-rows:minmax(0,1fr);
    border-top:1px solid var(--line);min-height:0;
  }
  .quiz-card{
    --card-accent:var(--gold);
    --card-wash:rgba(245,209,66,.16);
    --card-wash-soft:rgba(245,209,66,.02);
    position:relative;overflow:hidden;min-width:0;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
    gap:7px;padding:clamp(20px,3vh,40px) var(--gutter);
    background:transparent;border:none;border-left:1px solid var(--line);
    font:inherit;color:var(--ink);text-align:left;cursor:pointer;
    transition:background-color .35s var(--ease);
  }
  /* difficulty tiers borrow the saber palette: blue for the gentlest, red for the hardest */
  .quiz-card.lv-basic{--card-accent:var(--saber-blue);--card-wash:rgba(92,200,255,.16);--card-wash-soft:rgba(92,200,255,.02);}
  .quiz-card.lv-hard{--card-accent:var(--saber-red);--card-wash:rgba(255,77,77,.16);--card-wash-soft:rgba(255,77,77,.02);}
  .quiz-card:nth-child(3n+1){border-left:none;}
  .quiz-card:nth-child(n+4){border-top:1px solid var(--line);}
  .quiz-card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(0deg,var(--card-wash),var(--card-wash-soft) 45%,transparent 75%);
    opacity:0;transition:opacity .35s var(--ease);
  }
  .quiz-card::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg,var(--card-accent),transparent);
    transform:scaleX(0);transform-origin:0 50%;
    transition:transform .4s var(--ease);
  }
  .quiz-card:hover::after,.quiz-card:focus-visible::after{opacity:1;}
  .quiz-card:hover::before,.quiz-card:focus-visible::before{transform:scaleX(1);}
  .quiz-card:focus-visible{outline:none;}
  .quiz-ep{
    position:relative;z-index:1;
    font-size:clamp(9.5px,.95vw,11px);font-weight:800;letter-spacing:.3em;
    text-transform:uppercase;color:var(--cyan);
  }
  .quiz-name{
    position:relative;z-index:1;
    font-size:clamp(19px,2vw,30px);font-weight:800;color:#fff;
    letter-spacing:.01em;line-height:1.28;
  }
  .quiz-card.lv-basic .quiz-ep,.quiz-card.lv-hard .quiz-ep{color:var(--card-accent);}
  .quiz-count{
    position:relative;z-index:1;margin-top:clamp(8px,1.4vh,14px);
    display:flex;align-items:center;gap:12px;
    font-size:11px;font-weight:700;letter-spacing:.16em;
    color:var(--ink-dim);transition:color .3s var(--ease);
  }
  .quiz-card:hover .quiz-count{color:var(--card-accent);}
  /* hairline arrow that extends as the card is hovered */
  .go{width:34px;height:10px;overflow:visible;flex:0 0 auto;}
  .go line,.go polyline{
    transform-box:view-box;
    transition:transform .45s var(--ease);
  }
  .go .shaft{transform-origin:0 50%;transform:scaleX(.42);}
  .go .head{transform:translateX(-15px);}
  .quiz-card:hover .go .shaft{transform:scaleX(1);}
  .quiz-card:hover .go .head{transform:translateX(0);}

  /* ---------- 3. quiz screen : split view, hairline divider, no boxes ---------- */
  #screen-quiz{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);}
  .pane{
    position:relative;min-width:0;min-height:0;overflow-y:auto;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(22px,4vh,48px) var(--gutter);
  }
  .pane-q{gap:clamp(6px,1vh,10px);}
  .pane-a{border-left:1px solid var(--line);align-items:center;}

  .q-eyebrow{font-size:clamp(9.5px,.95vw,11px);font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);opacity:.85;}
  .q-index{
    font-weight:900;line-height:.84;letter-spacing:-.045em;
    font-size:clamp(60px,9vw,136px);
    background:linear-gradient(180deg,rgba(255,247,207,.95),rgba(245,209,66,.55) 48%,rgba(169,134,11,.1));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .q-rule{width:clamp(40px,5vw,72px);height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:clamp(8px,1.4vh,16px) 0;}
  .q-text{
    margin:0;max-width:21em;
    font-size:clamp(18px,1.85vw,29px);font-weight:700;line-height:1.5;
    color:#fff;letter-spacing:.005em;
  }

  /* choices are a hairline-ruled list, not boxes; the pick is marked by a saber blade */
  .choices{display:flex;flex-direction:column;width:100%;max-width:620px;}
  .choice{
    position:relative;
    display:flex;align-items:center;gap:clamp(13px,1.4vw,18px);
    padding:clamp(13px,2vh,19px) 2px clamp(13px,2vh,19px) 0;
    border-bottom:1px solid var(--line);
    font-size:clamp(13.5px,1.05vw,16px);line-height:1.55;
    cursor:pointer;
    transition:padding-left .3s var(--ease);
  }
  .choice:first-child{border-top:1px solid var(--line);}
  .choice .wash{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(125,216,255,.085),transparent 72%);
    opacity:0;transition:opacity .3s var(--ease);
  }
  .choice .blade{
    position:absolute;left:0;top:17%;bottom:17%;width:2px;border-radius:2px;
    background:linear-gradient(180deg,#fff8dc,var(--gold) 38%,var(--gold));
    box-shadow:0 0 6px rgba(245,209,66,.6),0 0 16px rgba(245,209,66,.35);
    transform:scaleY(0);transform-origin:50% 0;
    transition:transform .3s var(--ease);
  }
  .choice .key{
    flex:0 0 auto;min-width:1.1em;
    font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--ink-dim);
    transition:color .25s var(--ease);
  }
  .choice .label{transition:color .25s var(--ease);}
  .choice:hover{padding-left:clamp(11px,1.3vw,18px);}
  .choice:hover .wash{opacity:1;}
  .choice:hover .key{color:var(--cyan);}
  .choice.selected{padding-left:clamp(13px,1.5vw,20px);}
  .choice.selected .blade{transform:scaleY(1);}
  .choice.selected .key{color:var(--gold);}
  .choice.selected .label{color:#fff;font-weight:700;}

  /* ---------- 4. result screen : score / review split ---------- */
  #screen-result{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);}
  .res-hero{
    min-height:0;overflow-y:auto;
    display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
    padding:clamp(22px,4vh,48px) var(--gutter);
  }
  .res-set{font-size:clamp(9.5px,.95vw,11px);font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);}
  .res-score{
    margin:clamp(6px,1.2vh,14px) 0 0;display:flex;align-items:baseline;gap:4px;
    font-weight:900;line-height:.9;letter-spacing:-.04em;
    font-size:clamp(56px,8vw,118px);
    background:linear-gradient(180deg,#fff7cf,var(--gold) 52%,var(--gold-dim));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .res-score .of{font-size:.3em;font-weight:800;letter-spacing:0;
    background:linear-gradient(180deg,var(--ink-mid),var(--ink-dim));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .res-caption{margin:6px 0 0;font-size:clamp(10px,.95vw,11.5px);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim);}
  .res-rank{
    margin-top:clamp(14px,2.2vh,22px);padding-top:clamp(12px,1.8vh,18px);
    border-top:1px solid var(--line-mid);
    color:var(--gold);text-shadow:0 0 22px rgba(245,209,66,.3);
    font-size:clamp(13px,1.35vw,17px);font-weight:800;letter-spacing:.12em;
  }
  .res-desc{margin:clamp(10px,1.8vh,16px) 0 0;max-width:34em;font-size:clamp(11.5px,1.05vw,13.5px);line-height:1.85;color:var(--ink-mid);}

  .res-review{
    min-height:0;overflow-y:auto;border-left:1px solid var(--line);
    padding:clamp(16px,2.6vh,28px) var(--gutter);
  }
  .rev{
    position:relative;
    padding:clamp(12px,1.8vh,16px) 0 clamp(12px,1.8vh,16px) clamp(17px,1.7vw,23px);
    border-bottom:1px solid rgba(125,216,255,.09);
    transition:background-color .3s var(--ease);
  }
  .rev:last-child{border-bottom:none;}
  .rev.ok{--blade:var(--saber-blue);--core:var(--saber-blue-core);--glow:var(--saber-blue-glow);}
  .rev.ng{--blade:var(--saber-red);--core:var(--saber-red-core);--glow:var(--saber-red-glow);}

  /* the blade itself: ignites downward from the emitter, staggered per row */
  .rev::before{
    content:"";position:absolute;left:0;
    top:clamp(10px,1.5vh,14px);bottom:clamp(10px,1.5vh,14px);
    width:3px;border-radius:3px;
    background:linear-gradient(180deg,var(--core),var(--blade) 38%,var(--blade));
    box-shadow:0 0 5px var(--glow),0 0 13px var(--glow),0 0 28px var(--glow);
    transform-origin:50% 0;
    animation:ignite .5s var(--ease) backwards;
    animation-delay:calc(var(--i,0) * 45ms);
    transition:width .3s var(--ease),box-shadow .3s var(--ease);
  }
  @keyframes ignite{from{transform:scaleY(0);opacity:.15;}to{transform:scaleY(1);opacity:1;}}
  .rev:hover{background:linear-gradient(90deg,rgba(255,255,255,.045),transparent 42%);}
  .rev:hover::before{width:4px;box-shadow:0 0 8px var(--glow),0 0 20px var(--glow),0 0 40px var(--glow);}

  .rev-q{display:flex;gap:11px;align-items:flex-start;font-size:clamp(12.5px,1vw,14px);font-weight:700;color:#fff;line-height:1.6;}
  .rev-ic{
    flex:0 0 auto;width:17px;height:17px;margin-top:2px;border-radius:50%;
    display:grid;place-items:center;font-size:9.5px;font-weight:900;
    color:var(--core);background:var(--blade);
    box-shadow:0 0 7px var(--glow),0 0 15px var(--glow);
  }
  .rev-body{margin:7px 0 0 28px;}
  .rev-ans{font-size:clamp(11px,1vw,12.5px);line-height:1.7;color:var(--ink-mid);}
  .rev-ans b{color:var(--ink);font-weight:700;}
  .rev-ans .ok{color:var(--saber-blue);text-shadow:0 0 12px var(--saber-blue-glow);}
  .rev-ans .ng{color:var(--saber-red);text-shadow:0 0 12px var(--saber-red-glow);}
  .rev-ex{margin-top:4px;font-size:clamp(10.5px,.95vw,12px);line-height:1.75;color:var(--ink-dim);}

  /* ---------- controls: type-led, no chrome. a hairline draws in on hover ---------- */
  .btn{
    position:relative;
    border:none;background:none;padding:10px 1px;
    font:inherit;font-size:clamp(11.5px,1vw,13.5px);font-weight:700;letter-spacing:.2em;
    display:inline-flex;align-items:center;gap:11px;white-space:nowrap;
    color:var(--ink-mid);cursor:pointer;user-select:none;
    transition:color .3s var(--ease);
  }
  .btn::after{
    content:"";position:absolute;left:0;right:0;bottom:3px;height:1px;

    transform:scaleX(0);transform-origin:100% 50%;
    transition:transform .35s var(--ease);

  .btn:hover .chev.back{transform:translateX(-4px);}

  .skip{position:absolute;bottom:clamp(14px,3vh,28px);right:var(--gutter);z-index:4;}
  .back-btn{position:absolute;top:clamp(14px,2.6vh,26px);left:var(--gutter);z-index:4;}
  .bar-quiz,.bar-result{
    display:flex;align-items:center;justify-content:space-between;

  /* ---------- narrow / short viewports : stack the split views ---------- */
  /* tablet: episodes drop to 2 columns, the 3 difficulty tiers stay side by side */
  @media (max-width:1100px) and (min-width:861px){
    #quizList{grid-template-columns:repeat(2,minmax(0,1fr));}
    #quizList .quiz-card:nth-child(n){border-left:1px solid var(--line);border-top:none;}

  }

    .quiz-card{

    .pane-q{padding-bottom:clamp(12px,2vh,18px);}

    .q-text{max-width:none;font-size:clamp(16px,4.2vw,21px);}
    .choices{max-width:none;}
    #screen-result{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);}
    .res-hero{align-items:center;text-align:center;padding-bottom:clamp(14px,2vh,20px);}
    .res-desc{display:none;}
    .res-review{border-left:none;border-top:1px solid var(--line);}
    /* the wordmark and the episode name are both nowrap; together they force the bar wider than the screen */

    .mark{display:grid;place-items:center;flex:0 0 auto;}

  }

function makeStars(id, count, sizeMax, speedMin, speedMax){
  const layer = document.getElementById(id);
  let html = '';
  for(let i=0;i<count;i++){
    const x = Math.random()*100;
    const y = Math.random()*100;
    const s = (Math.random()*sizeMax+0.6).toFixed(2);
    const dur = (Math.random()*(speedMax-speedMin)+speedMin).toFixed(2);
    const delay = (Math.random()*6).toFixed(2);
    html += `<div class="twinkle" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
  }
  layer.innerHTML = html;
}

/* ---------- lightsaber sfx, synthesised at runtime so no audio files are shipped ----------
   the blade tone is two detuned saws under a sweeping lowpass; the snap is a short noise burst. */
const SFX = (() => {
  let ctx = null;
  let master = null;

  // localStorage throws on file:// and in some private-browsing modes
  function readPref(){
    try { return localStorage.getItem('sfx') !== 'off'; } catch { return true; }
  }
  function writePref(on){
    try { localStorage.setItem('sfx', on ? 'on' : 'off'); } catch {}
  }

  let enabled = readPref();

  function ensure(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.85;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function blade(t0, dur, fromHz, toHz, peak){
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 6;
    lp.frequency.setValueAtTime(380, t0);
    lp.frequency.exponentialRampToValueAtTime(1900, t0 + dur * 0.25);
    lp.frequency.exponentialRampToValueAtTime(680, t0 + dur);

    [0, 3.5].forEach(detune => {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(fromHz + detune, t0);
      osc.frequency.exponentialRampToValueAtTime(toHz + detune, t0 + dur * 0.3);
      osc.connect(lp);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    });

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.045);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    lp.connect(gain);
    gain.connect(master);
  }

  function hiss(t0, dur, peak, centre){
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(centre, t0);
    bp.frequency.exponentialRampToValueAtTime(centre * 0.4, t0 + dur);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(peak, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(bp); bp.connect(gain); gain.connect(master);
    src.start(t0); src.stop(t0 + dur);
  }

  function ready(){ return enabled && ensure(); }

  return {
    get enabled(){ return enabled; },
    toggle(){
      enabled = !enabled;
      writePref(enabled);
      if (enabled) this.select();
      return enabled;
    },
    ignite(){
      if (!ready()) return;
      const t = ctx.currentTime;
      hiss(t, 0.16, 0.16, 3200);
      blade(t, 0.85, 58, 112, 0.22);
    },
    powerDown(){
      if (!ready()) return;
      blade(ctx.currentTime, 0.55, 108, 42, 0.18);
    },
    swing(){
      if (!ready()) return;
      const t = ctx.currentTime;
      hiss(t, 0.22, 0.09, 1800);
      blade(t, 0.26, 150, 90, 0.13);
    },
    select(){
      if (!ready()) return;
      blade(ctx.currentTime, 0.16, 190, 260, 0.12);
    }
  };
})();

const GO_ARROW = `
  <svg class="go" viewBox="0 0 34 10" fill="none" stroke="currentColor"
       stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line class="shaft" x1="0.6" y1="5" x2="26" y2="5"/>
    <polyline class="head" points="21.6,1.2 25.8,5 21.6,8.8"/>
  </svg>`;

/* ---------- difficulty tiers, shared by every episode ---------- */
const LEVELS = [
  { id: 'basic', label: 'パダワン',         rank: 'Level 01' },
  { id: 'mid',   label: 'ジェダイ・ナイト',  rank: 'Level 02' },
  { id: 'hard',  label: 'ジェダイ・マスター', rank: 'Level 03' }
];

/* ---------- state ---------- */
let activeSet = null;
let activeLevel = null;
let activeQuestions = [];
let current = 0;
let score = 0;
let userAnswers = []; // selected choice index per question, null = unanswered
const answers = []; // {picked, correct, isCorrect} - built at grading time

const screenCrawl = document.getElementById('screen-crawl');
const screenIntro = document.getElementById('screen-intro');
const screenLevel = document.getElementById('screen-level');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');
const crawlInner = document.getElementById('crawlInner');
const quizListEl = document.getElementById('quizList');
const levelListEl = document.getElementById('levelList');

renderQuizList();

document.getElementById('skipCrawl').addEventListener('click', goToIntro);
crawlInner.addEventListener('animationend', goToIntro);
document.getElementById('backToEpisodes').addEventListener('click', quitToEpisodes);
document.getElementById('homeBtn').addEventListener('click', quitToEpisodes);

function quitToEpisodes(){
  SFX.powerDown();
  goToEpisodeSelect();
}
document.getElementById('prevBtn').addEventListener('click', goToPrevQuestion);
document.getElementById('nextBtn').addEventListener('click', goToNextQuestion);
document.getElementById('retryBtn').addEventListener('click', resetQuiz);

const soundToggle = document.getElementById('soundToggle');
soundToggle.classList.toggle('muted', !SFX.enabled);
soundToggle.addEventListener('click', () => {
  soundToggle.classList.toggle('muted', !SFX.toggle());
});

/* the shell shows/hides its top and bottom bars from this single flag */
function setState(state){
  document.body.dataset.state = state;
}

function goToIntro(){
  screenCrawl.classList.add('hidden');
  goToEpisodeSelect();
}

function goToEpisodeSelect(){
  screenLevel.classList.add('hidden');
  screenQuiz.classList.add('hidden');
  screenResult.classList.add('hidden');
  screenIntro.classList.remove('hidden');
  setState('intro');
  current = 0;
  score = 0;
  answers.length = 0;
  userAnswers = [];
}

function renderQuizList(){
  quizListEl.innerHTML = '';
  QUIZ_SETS.forEach(set => {
    const btn = document.createElement('button');
    btn.className = 'quiz-card';
    btn.innerHTML = `
      <span class="quiz-ep">${set.ep}</span>
      <span class="quiz-name">${set.name}</span>
      <span class="quiz-count">${GO_ARROW}</span>
    `;
    btn.addEventListener('click', () => goToLevelSelect(set));
    quizListEl.appendChild(btn);
  });
}

function goToLevelSelect(set){
  SFX.select();
  activeSet = set;
  document.getElementById('levelEp').textContent = set.ep;
  document.getElementById('levelName').textContent = set.name;
  renderLevelList(set);
  screenIntro.classList.add('hidden');
  screenLevel.classList.remove('hidden');
  setState('level');
}

function renderLevelList(set){
  levelListEl.innerHTML = '';
  LEVELS.forEach(level => {
    const questions = set.levels[level.id];
    const btn = document.createElement('button');
    btn.className = `quiz-card lv-${level.id}`;
    btn.innerHTML = `
      <span class="quiz-ep">${level.rank}</span>
      <span class="quiz-name">${level.label}</span>
      <span class="quiz-count">全${questions.length}問${GO_ARROW}</span>
    `;
    btn.addEventListener('click', () => startQuiz(set, level));
    levelListEl.appendChild(btn);
  });
}

function startQuiz(set, level){
  activeSet = set;
  activeLevel = level;
  activeQuestions = set.levels[level.id];
  current = 0;
  score = 0;
  answers.length = 0;
  userAnswers = new Array(activeQuestions.length).fill(null);
  screenLevel.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  setState('quiz');
  SFX.ignite();
  document.getElementById('metaSet').textContent = `${set.ep} ・ ${set.name}`;
  document.getElementById('metaLevel').textContent = level.label;
  renderQuestion();
}

function answeredCount(){
  return userAnswers.filter(a => a !== null).length;
}

function updateAnsweredMeta(){
  document.getElementById('metaAnswered').textContent =
    `回答済み ${answeredCount()} / ${activeQuestions.length}`;
}

function renderQuestion(){
  const questions = activeQuestions;
  const data = questions[current];
  const isLast = current === questions.length - 1;
  document.getElementById('metaPos').textContent =
    `${String(current+1).padStart(2,'0')} / ${questions.length}`;
  updateAnsweredMeta();
  document.getElementById('progressFill').style.width = `${((current+1)/questions.length)*100}%`;
  document.getElementById('qIndex').textContent = String(current+1).padStart(2,'0');
  document.getElementById('qText').textContent = data.q;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  data.choices.forEach((text, idx) => {
    const div = document.createElement('div');
    div.className = 'choice' + (userAnswers[current] === idx ? ' selected' : '');
    div.innerHTML = `<span class="wash"></span><span class="blade"></span>`
      + `<span class="key">${String.fromCharCode(65+idx)}</span><span class="label">${text}</span>`;
    div.addEventListener('click', () => selectChoice(idx));
    choicesEl.appendChild(div);
  });

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.disabled = current === 0;
  nextBtn.disabled = userAnswers[current] === null;
  nextBtn.innerHTML = `${isLast ? '結果を見る' : '次へ'}<svg class="chev" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1.6,1.4 6.2,6 1.6,10.6"/></svg>`;
}

function selectChoice(idx){
  if (userAnswers[current] !== idx) SFX.select();
  userAnswers[current] = idx;
  const choiceEls = document.querySelectorAll('#choices .choice');
  choiceEls.forEach((el, i) => el.classList.toggle('selected', i === idx));
  updateAnsweredMeta();
  document.getElementById('nextBtn').disabled = false;
}

function goToPrevQuestion(){
  if (current === 0) return;
  current--;
  SFX.swing();
  renderQuestion();
}

function goToNextQuestion(){
  const questions = activeQuestions;
  if (current === questions.length - 1){
    finishQuiz();
  } else {
    current++;
    SFX.swing();
    renderQuestion();
  }
}

function finishQuiz(){
  const questions = activeQuestions;
  score = 0;
  answers.length = 0;
  questions.forEach((data, i) => {
    const idx = userAnswers[i];
    const isCorrect = idx === data.correct;
    if (isCorrect) score++;
    answers.push({
      q: data.q,
      picked: idx === null ? '（未回答）' : data.choices[idx],
      correctText: data.choices[data.correct],
      isCorrect,
      explain: data.explain
    });
  });
  showResult();
}

function getRank(score){
  if (score === activeQuestions.length) return {
    title: "称号：フォースの申し子",
    desc: "全問正解。まるでミディ=クロリアン値が振り切れているかのような記憶力です。オビ=ワンもきっと誇らしげにうなずくでしょう。"
  };
  if (score >= 8) return {
    title: "称号：銀河の語り部",
    desc: "ほぼ完璧な理解度。物語の細部までしっかり記憶に刻まれています。"
  };
  if (score >= 6) return {
    title: "称号：ナブー王室護衛官",
    desc: "物語の大筋はばっちり。もう一度見返せば、さらに細かい部分まで思い出せるはずです。"
  };
  if (score >= 4) return {
    title: "称号：見習いパイロット",
    desc: "断片的には覚えているものの、まだ整理が必要なようです。もう一度見返してみましょう。"
  };
  return {
    title: "称号：タトゥイーンの砂の民",
    desc: "記憶はまだ砂に埋もれているようです。ぜひもう一度鑑賞してから再挑戦してください。"
  };
}

function showResult(){
  screenQuiz.classList.add('hidden');
  screenResult.classList.remove('hidden');
  setState('result');
  SFX.ignite();
  document.getElementById('progressFill').style.width = '100%';

  document.getElementById('resultSetLabel').textContent =
    `${activeSet.ep} ・ ${activeSet.name} ・ ${activeLevel.label}`;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalTotal').textContent = activeQuestions.length;
  const rank = getRank(score);
  document.getElementById('rankBadge').textContent = rank.title;
  document.getElementById('rankDesc').textContent = rank.desc;

  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  answers.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'rev ' + (a.isCorrect ? 'ok' : 'ng');
    div.style.setProperty('--i', i); // staggers the blade ignition down the list
    div.innerHTML = `
      <div class="rev-q">
        <span class="rev-ic">${a.isCorrect ? '✓' : '✕'}</span>
        <span>${String(i+1).padStart(2,'0')}. ${a.q}</span>
      </div>
      <div class="rev-body">
        <div class="rev-ans">
          回答 <b class="${a.isCorrect ? 'ok' : 'ng'}">${a.picked}</b>${a.isCorrect ? '' : ` ／ 正解 <b class="ok">${a.correctText}</b>`}
        </div>
        <div class="rev-ex">${a.explain}</div>
      </div>
    `;
    list.appendChild(div);
  });
  document.getElementById('reviewList').scrollTop = 0;
}

function resetQuiz(){
  quitToEpisodes();
}
</script>
